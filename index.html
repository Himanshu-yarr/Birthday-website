<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>

  <!-- FontAwesome for Premium Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap');

    body {
      background-color: #0f1115;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      margin: 0;
    }

    .font-serif {
      font-family: 'Playfair Display', serif;
    }

    .text-gold-gradient {
      background: linear-gradient(135deg, #FDE047 0%, #D97706 50%, #FDE047 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 5s linear infinite;
    }

    .bg-gold-gradient {
      background: linear-gradient(135deg, #FDE047 0%, #D97706 50%, #FDE047 100%);
      background-size: 200% auto;
      animation: shine 5s linear infinite;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .glass-card-gold {
      background: rgba(234, 179, 8, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(234, 179, 8, 0.2);
      box-shadow: 0 0 40px rgba(234, 179, 8, 0.1);
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    @keyframes float-slow {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.05);
      }
    }

    @keyframes pulse-gold {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4);
      }

      50% {
        box-shadow: 0 0 40px 10px rgba(234, 179, 8, 0.1);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    .animate-float-slow {
      animation: float-slow 10s ease-in-out infinite;
    }

    .animate-pulse-gold {
      animation: pulse-gold 3s ease-in-out infinite;
    }

    .animate-reveal {
      animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-100 {
      animation-delay: 100ms;
    }

    .delay-300 {
      animation-delay: 300ms;
    }

    .delay-500 {
      animation-delay: 500ms;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1115;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #D97706;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Premium Canvas Confetti System ---
    const CanvasConfetti = ({ trigger }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!trigger) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#FDE047', '#D97706', '#FFFFFF', '#F59E0B', '#FEF08A'];

        class Particle {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height - canvas.height;
            this.size = Math.random() * 8 + 4;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.speedY = Math.random() * 3 + 2;
            this.speedX = Math.random() * 2 - 1;
            this.angle = Math.random() * 360;
            this.spin = Math.random() * 0.2 - 0.1;
            this.opacity = 1;
          }

          update() {
            this.y += this.speedY;
            this.x += this.speedX;
            this.angle += this.spin;
            if (this.y > canvas.height) {
              this.y = -10;
              this.x = Math.random() * canvas.width;
            }
          }

          draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color;
            if (this.size % 2 === 0) {
              ctx.beginPath();
              ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
            }
            ctx.restore();
          }
        }

        for (let i = 0; i < 150; i++) {
          particles.push(new Particle());
        }

        let animationFrameId;
        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.update();
            p.draw();
          });
          animationFrameId = window.requestAnimationFrame(render);
        };

        render();

        const handleResize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, [trigger]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-40 transition-opacity duration-1000"
          style={{ opacity: trigger ? 1 : 0 }}
        />
      );
    };

    // --- Ambient Background Particles ---
    const AmbientBackground = () => (
      <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-yellow-600/10 rounded-full blur-[120px] mix-blend-screen animate-float-slow"></div>
        <div className="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-amber-600/10 rounded-full blur-[150px] mix-blend-screen animate-float-slow" style={{ animationDelay: '-5s' }}></div>
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40rem] h-[40rem] bg-indigo-900/20 rounded-full blur-[180px] mix-blend-screen"></div>
      </div>
    );

    // --- Scroll Reveal Component ---
    const FadeInSection = ({ children, delay = 0 }) => {
      const [isVisible, setVisible] = useState(false);
      const domRef = useRef();

      useEffect(() => {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) setVisible(true);
          });
        });
        const currentRef = domRef.current;
        if (currentRef) observer.observe(currentRef);
        return () => {
          if (currentRef) observer.unobserve(currentRef);
        };
      }, []);

      return (
        <div ref={domRef} className={`reveal-on-scroll ${isVisible ? 'is-visible' : ''}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    };

    // --- Main Application Component ---
    const App = () => {
      const [stage, setStage] = useState('gift');
      const [scrollProgress, setScrollProgress] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [wishMade, setWishMade] = useState(false);
      const audioRef = useRef(null);

      // Premium royalty-free ambient track
      const audioUrl = "https://cdn.pixabay.com/download/audio/2022/01/26/audio_d0c6ff1bc9.mp3?filename=piano-moment-9835.mp3";

      useEffect(() => {
        const handleScroll = () => {
          const totalScroll = document.documentElement.scrollTop;
          const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const scroll = `${totalScroll / windowHeight}`;
          setScrollProgress(Number(scroll));
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const openGift = () => {
        setStage('opening');
        if (audioRef.current) {
          audioRef.current.play().catch(e => console.log("Audio play prevented:", e));
          setIsPlaying(true);
        }
        setTimeout(() => {
          setStage('celebration');
        }, 800);
      };

      const toggleAudio = () => {
        if (isPlaying) {
          audioRef.current.pause();
        } else {
          audioRef.current.play();
        }
        setIsPlaying(!isPlaying);
      };

      return (
        <div className="relative min-h-screen bg-[#0f1115] text-white overflow-hidden selection:bg-amber-500/30">
          <AmbientBackground />
          <audio ref={audioRef} src={"/assets/Anuv Jain - HUSN (Official Video)(MP3_160K).mp3"} loop />

          {/* Floating Music Player */}
          <div className={`fixed bottom-8 right-8 z-50 transition-all duration-1000 ${stage === 'celebration' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-20 pointer-events-none'}`}>
            <button onClick={toggleAudio} className="glass-card-gold rounded-full p-4 flex items-center gap-3 hover:scale-105 transition-transform shadow-2xl">
              {isPlaying ? (
                <div className="flex items-center gap-2">
                  <span className="flex gap-1 h-4 items-end">
                    <span className="w-1 bg-amber-400 h-full animate-pulse"></span>
                    <span className="w-1 bg-amber-400 h-2/3 animate-pulse delay-100"></span>
                    <span className="w-1 bg-amber-400 h-full animate-pulse delay-300"></span>
                  </span>
                  <i className="fa-solid fa-pause text-amber-400 text-xl"></i>
                </div>
              ) : (
                <i className="fa-solid fa-play text-amber-400 text-xl"></i>
              )}
            </button>
          </div>

          {/* Progress Bar */}
          {stage === 'celebration' && (
            <div className="fixed top-0 left-0 h-1 bg-white/10 z-50 w-full">
              <div className="h-full bg-gold-gradient transition-all duration-150 ease-out" style={{ width: `${scrollProgress * 100}%` }} />
            </div>
          )}

          {/* STAGE 1: The Gift */}
          <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center transition-all duration-1000 ease-in-out ${stage === 'gift' ? 'opacity-100 visible' : 'opacity-0 invisible scale-110'}`}>
            <div className="text-center space-y-12 animate-reveal">
              <div className="space-y-4">
                <h2 className="font-serif text-2xl md:text-3xl text-gray-400 tracking-[0.2em] uppercase">For Someone Special</h2>
                <p className="text-sm text-gray-500 font-light tracking-widest">A premium experience awaits</p>
              </div>
              <button onClick={openGift} className="group relative inline-flex items-center justify-center animate-pulse-gold rounded-full p-1 transition-transform duration-300 hover:scale-105 active:scale-95">
                <div className="absolute inset-0 bg-gold-gradient rounded-full opacity-20 group-hover:opacity-40 blur-xl transition-opacity duration-500"></div>
                <div className="relative glass-card rounded-full p-10 flex flex-col items-center justify-center gap-4 border border-white/10 group-hover:border-amber-500/50 transition-colors duration-500">
                  <i className="fa-solid fa-gift text-6xl text-amber-400 group-hover:text-amber-300 transition-colors duration-300 animate-float"></i>
                  <span className="font-serif text-lg tracking-widest text-amber-200/80 group-hover:text-amber-200 transition-colors">TAP TO OPEN</span>
                </div>
              </button>
            </div>
          </div>

          {/* STAGE 2: The Celebration */}
          <CanvasConfetti trigger={stage === 'celebration'} />

          <div className={`relative z-10 transition-all duration-1500 ease-out ${stage === 'celebration' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-20 hidden'}`}>

            {/* Hero Section */}
            <section className="min-h-screen flex flex-col items-center justify-center px-4 relative">
              <div className="absolute top-10 w-full flex justify-between px-10 opacity-50">
                <i className="fa-solid fa-wand-magic-sparkles text-amber-400 text-2xl animate-float"></i>
                <i className="fa-solid fa-wand-magic-sparkles text-amber-400 text-3xl animate-float delay-500"></i>
              </div>

              <div className="text-center space-y-8 max-w-5xl mx-auto z-10">
                <div className="inline-flex items-center gap-3 px-6 py-2 rounded-full glass-card border-white/5 mb-6 opacity-0 animate-reveal">
                  <i className="fa-solid fa-star text-amber-400 text-sm"></i>
                  <span className="text-sm tracking-[0.3em] uppercase text-amber-100/80 font-light">A Day To Remember</span>
                  <i className="fa-solid fa-star text-amber-400 text-sm"></i>
                </div>
                <h1 className="font-serif text-6xl md:text-8xl lg:text-[9rem] leading-none tracking-tight opacity-0 animate-reveal delay-100">
                  <span className="block text-white mb-2">Happy</span>
                  <span className="block text-gold-gradient drop-shadow-2xl font-bold">Birthday</span>
                </h1>
                <p className="text-lg md:text-2xl text-gray-300 font-light max-w-2xl mx-auto leading-relaxed opacity-0 animate-reveal delay-300">
                  Wishing you a year filled with exquisite moments, boundless joy, and extraordinary adventures.
                </p>
              </div>

              <div className="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-0 animate-reveal delay-500">
                <span className="text-xs tracking-widest text-gray-500 uppercase">Scroll to explore</span>
                <i className="fa-solid fa-chevron-down text-amber-500 text-xl animate-bounce"></i>
              </div>
            </section>

            {/* Stats Section */}
            <section className="py-20 px-4 bg-black/40 border-y border-white/5 relative z-10">
              <div className="max-w-6xl mx-auto">
                <FadeInSection>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                    <div className="text-center space-y-4 p-6 glass-card rounded-2xl hover:-translate-y-2 transition-transform duration-300">
                      <i className="fa-regular fa-clock text-amber-500 text-3xl mx-auto block mb-2"></i>
                      <div className="font-serif text-3xl md:text-4xl text-white">8,760+</div>
                      <div className="text-xs tracking-widest text-gray-400 uppercase">Hours of Joy This Year</div>
                    </div>
                    <div className="text-center space-y-4 p-6 glass-card rounded-2xl hover:-translate-y-2 transition-transform duration-300">
                      <i className="fa-solid fa-star text-amber-500 text-3xl mx-auto block mb-2"></i>
                      <div className="font-serif text-3xl md:text-4xl text-white">100%</div>
                      <div className="text-xs tracking-widest text-gray-400 uppercase">Pure Excellence</div>
                    </div>
                    <div className="text-center space-y-4 p-6 glass-card rounded-2xl hover:-translate-y-2 transition-transform duration-300">
                      <i className="fa-solid fa-heart text-amber-500 text-3xl mx-auto block mb-2"></i>
                      <div className="font-serif text-3xl md:text-4xl text-white">Infinite</div>
                      <div className="text-xs tracking-widest text-gray-400 uppercase">Love Received</div>
                    </div>
                    <div className="text-center space-y-4 p-6 glass-card rounded-2xl hover:-translate-y-2 transition-transform duration-300">
                      <i className="fa-regular fa-star text-amber-500 text-3xl mx-auto block mb-2"></i>
                      <div className="font-serif text-3xl md:text-4xl text-white">365</div>
                      <div className="text-xs tracking-widest text-gray-400 uppercase">New Opportunities</div>
                    </div>
                  </div>
                </FadeInSection>
              </div>
            </section>

            {/* Timeline Section */}
            <section className="py-32 px-4 relative">
              <div className="max-w-4xl mx-auto space-y-20">
                <FadeInSection>
                  <div className="text-center space-y-4">
                    <i className="fa-solid fa-location-dot text-amber-500 text-3xl mx-auto block mb-4"></i>
                    <h2 className="font-serif text-4xl md:text-5xl text-white">The Journey So Far</h2>
                    <p className="text-gray-400 tracking-widest uppercase text-sm">Milestones of a beautiful life</p>
                  </div>
                </FadeInSection>

                <div className="relative border-l border-amber-500/30 ml-4 md:mx-auto md:ml-auto space-y-16 py-8">
                  {[
                    { year: "The Beginning", title: "A Star is Born", desc: "The world became a little brighter on this very day." },
                    { year: "Growing Up", title: "Chasing Dreams", desc: "Discovering passions, making friends, and learning to fly." },
                    { year: "The Present", title: "A Beautiful Soul", desc: "Achieving greatness and touching the lives of everyone around." },
                    { year: "The Future", title: "Unwritten Pages", desc: "The best is yet to come. The world is yours to conquer." }
                  ].map((item, idx) => (
                    <FadeInSection key={idx} delay={idx * 100}>
                      <div className="relative pl-8 md:pl-0 md:w-1/2 md:odd:pr-12 md:even:pl-12 md:even:ml-auto">
                        <div className="absolute top-0 left-[-5px] md:left-auto md:right-[-5px] md:even:left-[-5px] w-3 h-3 bg-amber-400 rounded-full shadow-[0_0_15px_rgba(251,191,36,0.8)]"></div>
                        <div className="glass-card p-8 rounded-2xl hover:border-amber-500/50 transition-colors">
                          <span className="text-amber-500 text-sm tracking-widest font-bold uppercase">{item.year}</span>
                          <h3 className="font-serif text-2xl text-white mt-2 mb-3">{item.title}</h3>
                          <p className="text-gray-400 font-light leading-relaxed">{item.desc}</p>
                        </div>
                      </div>
                    </FadeInSection>
                  ))}
                </div>
              </div>
            </section>

            {/* Interactive Make A Wish Section */}
            <section className="py-32 px-4 relative bg-black/60 border-y border-amber-500/10">
              <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-900/20 via-[#0f1115]/0 to-[#0f1115]/0 pointer-events-none"></div>
              <div className="max-w-3xl mx-auto text-center relative z-10">
                <FadeInSection>
                  <i className="fa-solid fa-cake-candles text-amber-500 text-5xl mx-auto block mb-8"></i>
                  <h2 className="font-serif text-4xl md:text-5xl text-amber-300 mb-6">Make a Wish</h2>
                  <p className="text-gray-300 mb-12 font-light text-lg">Close your eyes, focus on your deepest desire, and tap the light to send it to the stars.</p>

                  {!wishMade ? (
                    <button onClick={() => setWishMade(true)} className="group relative inline-flex items-center justify-center p-8 rounded-full">
                      <div className="absolute inset-0 bg-amber-500 opacity-20 group-hover:opacity-40 blur-2xl transition-opacity duration-1000 animate-pulse"></div>
                      <div className="relative w-24 h-24 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-200 shadow-[0_0_50px_rgba(251,191,36,0.6)] flex items-center justify-center group-hover:scale-110 transition-transform duration-500">
                        <i className="fa-solid fa-star text-amber-900 text-3xl"></i>
                      </div>
                    </button>
                  ) : (
                    <div className="space-y-6 animate-reveal">
                      <div className="inline-block p-4 rounded-full bg-amber-500/10 mb-4">
                        <i className="fa-solid fa-star text-amber-400 text-4xl animate-spin" style={{ animationDuration: '3s' }}></i>
                      </div>
                      <h3 className="font-serif text-3xl text-gold-gradient">Your wish is out there!</h3>
                      <p className="text-gray-400 italic">"The universe is conspiring to make it happen."</p>
                    </div>
                  )}
                </FadeInSection>
              </div>
            </section>

            {/* Personal Message Section */}
            <section className="py-32 px-4 relative">
              <FadeInSection>
                <div className="max-w-4xl mx-auto">
                  <div className="glass-card-gold rounded-[2.5rem] p-8 md:p-16 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-amber-500/10 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2"></div>
                    <div className="absolute bottom-0 left-0 w-64 h-64 bg-yellow-500/10 rounded-full blur-[80px] translate-y-1/2 -translate-x-1/2"></div>
                    <i className="fa-solid fa-quote-left text-amber-500/20 text-6xl absolute top-8 left-8"></i>

                    <div className="relative z-10 space-y-8 text-center md:text-left">
                      <h2 className="font-serif text-4xl md:text-5xl text-amber-300 mb-8">A Special Wish</h2>
                      <div className="space-y-6 text-gray-300 text-lg md:text-xl font-light leading-relaxed">
                        <p>Today is not just another day; it is a celebration of the remarkable person you are. From your infectious laughter to your endless kindness, you bring light into the lives of everyone around you.</p>
                        <p>May this new chapter of your life be written in gold. May your dreams take flight, your passions ignite, and your heart be forever full. Here is to celebrating your past, embracing your present, and toasting to an incredibly bright future.</p>
                        <p className="text-amber-200 font-medium pt-4">With all the love in the world,<br /><span className="font-serif text-2xl mt-2 block">— Your Loved Ones</span></p>
                      </div>
                    </div>
                  </div>
                </div>
              </FadeInSection>
            </section>

            {/* Gallery Section */}
            <section className="py-32 px-4 bg-black/30 border-y border-white/5 relative">
              <div className="max-w-7xl mx-auto">
                <FadeInSection>
                  <div className="text-center mb-20 space-y-4">
                    <i className="fa-solid fa-camera text-amber-500 text-4xl mx-auto block mb-4"></i>
                    <h2 className="font-serif text-4xl md:text-6xl text-white">Golden Memories</h2>
                    <p className="text-gray-400 tracking-widest uppercase text-sm">Cherished moments captured in time</p>
                  </div>
                </FadeInSection>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                  {[
                    { img: "/assets/Beachfront Paradise.avif", title: "Joyful Celebrations" },
                    { img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=800", title: "Joyful Celebrations" },
                    { img: "https://images.unsplash.com/photo-1530103862676-de889caefce3?auto=format&fit=crop&q=80&w=800", title: "Unforgettable Nights" },
                    { img: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&q=80&w=800", title: "Beautiful Journey" },
                    { img: "/assets/Beachfront Paradise.avif", title: "Joyful Celebrations" },
                    { img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&q=80&w=800", title: "Joyful Celebrations" },
                    { img: "/assets/Historic Cottage in Charleston.avif", title: "Unforgettable Nights" },
                    { img: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&q=80&w=800", title: "Beautiful Journey" },

                  ].map((item, index) => (
                    <FadeInSection key={index} delay={index * 200}>
                      <div className="group relative aspect-[4/5] rounded-2xl overflow-hidden glass-card cursor-pointer transform transition-all duration-700 hover:-translate-y-4 hover:shadow-2xl hover:shadow-amber-500/20">
                        <img
                          src={item.img}
                          alt={item.title}
                          className="absolute inset-0 w-full h-full object-cover opacity-60 transition-transform duration-1000 group-hover:scale-110 group-hover:opacity-90"
                          onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&q=80&w=800'; }}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        <div className="absolute bottom-0 left-0 p-8 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
                          <div className="w-8 h-[2px] bg-amber-400 mb-4 transform origin-left scale-x-0 group-hover:scale-x-100 transition-transform duration-500 delay-100"></div>
                          <h3 className="font-serif text-2xl text-white mb-2">{item.title}</h3>
                        </div>
                      </div>
                    </FadeInSection>
                  ))}
                </div>
              </div>
            </section>

            {/* Footer Section */}
            <footer className="py-32 text-center relative overflow-hidden">
              <div className="absolute inset-0 flex justify-center items-center opacity-5">
                <i className="fa-solid fa-heart text-amber-500 text-[400px]"></i>
              </div>
              <div className="relative z-10 space-y-6">
                <FadeInSection>
                  <h2 className="font-serif text-3xl md:text-5xl text-gold-gradient mb-4">Have a wonderful year ahead</h2>
                  <p className="text-gray-500 font-light tracking-widest text-sm">DESIGNED WITH LOVE & ELEGANCE</p>
                </FadeInSection>
              </div>
            </footer>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
